name: HIFITI-Auto-Checkin

on:
  workflow_dispatch:
  # 注意：站点防火墙会拦截 GitHub Actions 海外 IP（fetch failed），
  # 定时运行请改用国内服务器执行 server-deploy/checkin.php（见该目录 README）。
  # schedule:
  #   # UTC
  #   - cron: "40 23 * * *"

jobs:
  checkin:
    name: Checkin
    runs-on: ubuntu-latest
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js latest.
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Network diagnosis
        shell: bash
        run: |
          for d in www.hifini.com.cn www.hifihi.com www.hifini.net; do
            echo "=== $d ==="
            echo "--- DNS ---"
            nslookup "$d" 2>&1 | tail -6 || true
            echo "--- curl ---"
            curl -sv --max-time 15 "https://$d/" -o /dev/null 2>&1 | grep -E "Trying|Connected|SSL|HTTP|error|timed out|refused|reset" || true
            echo ""
          done

      - name: Checkin
        id: checkin
        shell: bash
        run: |
          node main.js

      - name: Notify
        if: ${{ always() && env.TELEGRAM_TOKEN && env.TELEGRAM_TO }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *HIFINI 自动签到*

            ${{ steps.checkin.outputs.result  }}

            [任务详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
